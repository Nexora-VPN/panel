# Nexora Panel — PostgreSQL.
#
#   docker compose up -d
#   docker compose logs panel | grep setup     # the first-run setup link
#
# Set POSTGRES_PASSWORD in .env before the first start (copy .env.example). It is
# read by both services, so the two always agree.
#
# On first boot the panel has no account. It prints one-time setup links to its
# log — one per address it can name, led by the address the internet sees this
# host as, because inside a container every address on every interface is bridge
# addressing that reaches nothing. Open whichever one reaches your server; the
# wizard there sets the main admin, the panel path and HTTPS. To print the
# link's token again:
#
#   docker compose exec panel /app/nexora-panel setup-token
services:
  panel:
    image: ghcr.io/nexora-vpn/panel:latest
    restart: unless-stopped
    container_name: nexora-panel
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Pins the address *inside* the container; see the published mapping below.
      # Inside the container, bind the IPv6 wildcard — it accepts IPv4 too. What
      # reaches the host is the port mapping below, so an IPv6-only host also
      # needs that published on IPv6 (see the install guide).
      NEXORA_WEB_LISTEN: "[::]:2095"
      NEXORA_DB_DRIVER: postgres
      NEXORA_DB_DSN: "host=postgres port=5432 user=nexora password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env} dbname=nexora sslmode=disable"
    volumes:
      - ./bin:/app/bin
      - ./sub-themes:/app/sub-themes:ro
      - /etc/machine-id:/etc/machine-id:ro
    ports:
      - "2095:2095"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: nexora-postgres
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nexora
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The panel migrates on start, so it must not race an unready cluster.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
